<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141821'/%3E%3Crect x='3' y='8' width='5' height='5' fill='%23d8b978'/%3E%3Crect x='8' y='3' width='5' height='5' fill='%236fb3ba'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
    <script>
      // The pages are prerendered, so their text is in this file. When the
      // sign-in curtain is on and nobody is signed in, hide the content before
      // it is painted; the app takes the attribute off once it has hydrated.
      // This hides the copy from view, not from anyone reading the source.
      try {
        if (
          document.querySelector('meta[name="sso-gate"][content="on"]') &&
          !sessionStorage.getItem('sso.held')
        ) {
          document.documentElement.setAttribute('data-prelock', '');
        }
      } catch (e) {}
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
