name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from https://<org>.github.io/<repo>/, so the
      # app's base path has to match the repository name. For a user or org
      # site (<org>.github.io) set BASE_PATH to an empty string instead.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Sign-in curtain. Set these two as repository variables to switch it
          # on; leave them unset and the site is open. See README.md.
          PUBLIC_OIDC_ISSUER: ${{ vars.PUBLIC_OIDC_ISSUER }}
          PUBLIC_OIDC_CLIENT_ID: ${{ vars.PUBLIC_OIDC_CLIENT_ID }}
          PUBLIC_OIDC_IDP_HINT: ${{ vars.PUBLIC_OIDC_IDP_HINT }}

      # Fails the deploy if the wording changed without copy.lock.txt changing
      # with it. See "Editing copy" in README.md.
      - name: Copy lock
        run: node scripts/copy-lock.js check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
